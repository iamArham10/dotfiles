set -g default-shell /usr/bin/zsh

# Terminal / Color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# General
set -g set-clipboard on
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g mouse on
set -g status-interval 3
set -g allow-passthrough on
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"
set -g display-time 2000

set -s copy-command 'wl-copy'

# Prefix
set -g prefix C-s
bind C-b send-prefix

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Splits in CWD
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind \"
bind - split-window -v -c "#{pane_current_path}"

# New window in CWD
bind c new-window -c "#{pane_current_path}"

# Resize panes (lowercase hjkl)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Switch windows
bind -r H previous-window
bind -r L next-window
bind -r Space previous-window
bind -r n next-window

# Swap panes (uppercase JK)
bind -r J swap-pane -D
bind -r K swap-pane -U

# Maximize pane
bind -r m resize-pane -Z

# Kill pane without confirmation
bind X kill-pane

# Toggle status bar
bind b set-option -g status

# Sessions
bind S choose-tree -sZ
# Login shell so PATH has fd/fzf
bind f popup -E -w 90% -h 80% "bash -lc '$HOME/.local/bin/tmux-sessionizer'"
bind N command-prompt -p "New session name:" "new-session -s '%%'"
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session

# Rename current window (pre-filled)
bind R command-prompt -I "#W" "rename-window '%%'"

# Vi copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy || xclip -selection clipboard"
unbind -T copy-mode-vi MouseDragEnd1Pane
bind P paste-buffer

# Indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect / Continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Style -- Nord-inspired minimal
gray="#808080"
gray_dark="#3B4252"
gray_light="#4C566A"
accent="#88C0D0"
fg_dim="#616E88"

set -g status-position bottom
set -g status-style "fg=${gray},bg=default"
set -g status-left "#[fg=${accent},bold] #S #[fg=${gray_dark}]|  "
set -g status-left-length 30
set -g status-right "#[fg=${fg_dim}]%H:%M"
set -g status-right-length 20
set -g status-justify left

set -g window-status-current-format "#[fg=${accent},bold] #W"
set -g window-status-format "#[fg=${gray_dark}] #W"
set -g window-status-separator " "

set -g message-style "fg=${accent},bg=default"
set -g mode-style "fg=${gray_dark},bg=${accent}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${accent}"
set -g pane-border-lines single

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
