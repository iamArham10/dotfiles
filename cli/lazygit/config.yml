# Lazygit Configuration
gui:
  # Theme
  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - white
    selectedLineBgColor:
      - reverse
    cherryPickedCommitBgColor:
      - cyan
    cherryPickedCommitFgColor:
      - blue
  # Show file icons (requires nerd font)
  showFileIcons: true
  # Show random tip at startup
  showRandomTip: false
  # Mouse support
  mouseEvents: true
  # Split view
  splitDiff: 'auto'
  # Show bottom line with keybindings
  showBottomLine: true
  # Border style
  border: 'rounded'
  # Animate scroll
  animateExplosion: true
git:
  # Use delta as pager for diffs
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  # Auto fetch interval (in seconds, 0 to disable)
  autoFetch: true
  autoFetchInterval: 120
  # Commit settings
  commit:
    signOff: false
  # Log settings
  log:
    showGraph: 'always'
    showWholeGraph: false
# Keybindings
keybinding:
  universal:
    quit: 'q'
    quit-alt1: '<c-c>'
    return: '<esc>'
    quitWithoutChangingDirectory: 'Q'
    togglePanel: '<tab>'
    prevItem: '<up>'
    nextItem: '<down>'
    prevItem-alt: 'k'
    nextItem-alt: 'j'
    prevPage: ','
    nextPage: '.'
    gotoTop: '<'
    gotoBottom: '>'
    scrollLeft: 'H'
    scrollRight: 'L'
    prevBlock: '<left>'
    nextBlock: '<right>'
    prevBlock-alt: 'h'
    nextBlock-alt: 'l'
    jumpToBlock:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
    nextMatch: 'n'
    prevMatch: 'N'
    openFile: 'o'
    scrollUpMain: '<pgup>'
    scrollDownMain: '<pgdown>'
    scrollUpMain-alt1: 'K'
    scrollDownMain-alt1: 'J'
    executeShellCommand: ':'
    createRebaseOptionsMenu: 'm'
    refresh: 'R'
    optionMenu: 'x'
    confirm: '<enter>'
    remove: 'd'
    new: 'n'
    edit: 'e'
    openRecentRepos: '<c-r>'
    toggleWhitespaceInDiffView: '<c-w>'
    increaseContextInDiffView: '}'
    decreaseContextInDiffView: '{'
    copyToClipboard: '<c-o>'
    submitEditorText: '<enter>'
    extrasMenu: '@'
    togglePanelFocus: 'z'
os:
  # Open file with
  editPreset: 'nvim'
# Refresh mode
refresher:
  refreshInterval: 10
  fetchInterval: 60
# Confirmation prompts
notARepository: 'prompt'
# Custom commands (press ':' to access)
customCommands:
  - key: '<c-f>'
    command: 'git fetch --all --prune'
    context: 'global'
    description: 'Fetch all remotes'
  - key: 'P'
    command: 'git push -u origin {{.SelectedLocalBranch.Name}}'
    context: 'localBranches'
    loadingText: 'Pushing...'
    description: 'Push and set upstream'
