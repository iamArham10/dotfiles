# size = 12
#
# [font.normal]
# family = "JetBrains Mono"
#
# [env]
# TERM = "xterm-256color"


[window]
padding = { x = 0, y = 0 }

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[env]
TERM = "xterm-256color"

[general]
import = [
    "~/.config/alacritty/themes/themes/dark_plus.toml"
]

