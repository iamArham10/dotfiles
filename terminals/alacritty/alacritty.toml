[window]
padding = { x = 8, y = 8 }

[font]
size = 13.0

[font.normal]
family = "Fira Code"
style = "Regular"

[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"
style = "Italic"

[env]
TERM = "xterm-256color"
