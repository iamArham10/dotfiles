# Hyprlock — lock screen config

general {
    no_fade_in = true
    no_fade_out = true
}

background {
    monitor =
    color = rgb(1a1a2e)
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgba(87ceebee)
    inner_color = rgba(1a1a1aee)
    font_color = rgb(d0d0d0)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    halign = center
    valign = center
    position = 0, -20
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrains Mono
    color = rgba(d0d0d0ee)
    halign = center
    valign = center
    position = 0, 100
}
