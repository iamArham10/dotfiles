# ══════════════════════════════════════════════════════════════════════════════
#  HYPRLAND CONFIG — Arham's Fun Setup
# ══════════════════════════════════════════════════════════════════════════════

# ─── Variables ────────────────────────────────────────────────────────────────
$mod = SUPER
$terminal = ghostty
$menu = fuzzel

# ─── Monitors ─────────────────────────────────────────────────────────────────
# External (left), Laptop (right)
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = eDP-1, 1920x1080@60, 1920x0, 1.5

# ─── Autostart ────────────────────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland TERMINAL=ghostty
exec-once = waybar -c ~/.config/waybar/config-hyprland -s ~/.config/waybar/style-hyprland.css
exec-once = swaync
exec-once = libinput-gestures-setup start
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = hyprpaper
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gnome-keyring-daemon --start --components=secrets
exec = sh -c 'ddcutil setvcp dc 3 --bus 4 && ddcutil setvcp 87 4 --bus 4'

# ─── Appearance ───────────────────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(b4befeee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        vibrancy = 0.2
        vibrancy_darkness = 0.3
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1a2e55)
    }

    active_opacity = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0
}

animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    bezier = smooth, 0.25, 1.0, 0.5, 1.0
    animation = windows, 1, 4, snappy, slide
    animation = windowsOut, 1, 4, snappy, popin 80%
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, snappy, slide
    animation = border, 1, 8, smooth
    animation = borderangle, 1, 30, smooth, loop
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ─── Input ────────────────────────────────────────────────────────────────────
input {
    kb_options = caps:escape
    repeat_delay = 300
    repeat_rate = 30

    touchpad {
        natural_scroll = true
        tap-to-click = true
        middle_button_emulation = true
        scroll_factor = 0.7
    }

    sensitivity = -0.3
}

# ─── Workspace → Monitor Bindings ─────────────────────────────────────────────
# Laptop workspaces (1-6)
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1

# External workspaces (7-12)
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1
workspace = 11, monitor:HDMI-A-1
workspace = 12, monitor:HDMI-A-1

# ═══════════════════════════════════════════════════════════════════════════════
#  KEY BINDINGS — APPLICATIONS
# ═══════════════════════════════════════════════════════════════════════════════
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, N, exec, $terminal -e yazi
bind = $mod, O, exec, com.simplenote.Simplenote --ozone-platform=wayland
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exec, wlogout -b 4 -m 300
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, B, exec, killall -SIGUSR1 waybar

# ═══════════════════════════════════════════════════════════════════════════════
#  KEY BINDINGS — WORKSPACES
# ═══════════════════════════════════════════════════════════════════════════════
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod, minus, workspace, 11
bind = $mod, equal, workspace, 12

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod SHIFT, minus, movetoworkspace, 11
bind = $mod SHIFT, equal, movetoworkspace, 12

# ═══════════════════════════════════════════════════════════════════════════════
#  KEY BINDINGS — WINDOW MANAGEMENT
# ═══════════════════════════════════════════════════════════════════════════════
# Move focus
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
# Note: $mod+L is lock screen

# Grid workspace navigation
bind = $mod CTRL, up, exec, ~/.config/hypr/grid-nav.sh up
bind = $mod CTRL, down, exec, ~/.config/hypr/grid-nav.sh down
bind = $mod CTRL, left, exec, ~/.config/hypr/grid-nav.sh left
bind = $mod CTRL, right, exec, ~/.config/hypr/grid-nav.sh right
bind = $mod CTRL SHIFT, up, exec, ~/.config/hypr/grid-nav.sh up -m
bind = $mod CTRL SHIFT, down, exec, ~/.config/hypr/grid-nav.sh down -m
bind = $mod CTRL SHIFT, left, exec, ~/.config/hypr/grid-nav.sh left -m
bind = $mod CTRL SHIFT, right, exec, ~/.config/hypr/grid-nav.sh right -m

# Move windows (also merges into groups)
bind = $mod SHIFT, left, movewindoworgroup, l
bind = $mod SHIFT, down, movewindoworgroup, d
bind = $mod SHIFT, up, movewindoworgroup, u
bind = $mod SHIFT, right, movewindoworgroup, r
bind = $mod SHIFT, H, movewindoworgroup, l
bind = $mod SHIFT, J, movewindoworgroup, d
bind = $mod SHIFT, K, movewindoworgroup, u
bind = $mod SHIFT, L, movewindoworgroup, r

# Layout
bind = $mod, V, togglesplit
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, space, togglefloating
bind = $mod, space, cyclenext
bind = $mod SHIFT, S, pin

# Tab/Group layout (like Sway's Super+W tabbed)
bind = $mod, W, togglegroup
bind = $mod, Tab, changegroupactive, f
bind = $mod SHIFT, Tab, changegroupactive, b

# Resize submap
bind = $mod, R, submap, resize
submap = resize
binde = , left, resizeactive, -20 0
binde = , down, resizeactive, 0 20
binde = , up, resizeactive, 0 -20
binde = , right, resizeactive, 20 0
binde = , H, resizeactive, -20 0
binde = , J, resizeactive, 0 20
binde = , K, resizeactive, 0 -20
binde = , L, resizeactive, 20 0
bind = , Return, submap, reset
bind = , escape, submap, reset
submap = reset

# Mouse drag/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ═══════════════════════════════════════════════════════════════════════════════
#  KEY BINDINGS — SYSTEM CONTROLS
# ═══════════════════════════════════════════════════════════════════════════════
# Brightness (laptop)
binde = , XF86MonBrightnessUp, exec, brightnessctl set +3%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 3%-
binde = $mod, F6, exec, brightnessctl set +1%
binde = $mod, F5, exec, brightnessctl set 1%-

# Brightness (external DDC)
binde = $mod, F8, exec, ddcutil setvcp 10 + 10
binde = $mod, F7, exec, ddcutil setvcp 10 - 10

# Volume
binde = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
binde = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind  = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
binde = $mod, F3, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
binde = $mod, F2, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind  = $mod, F1, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Screenshots
bind = $mod, P, exec, grim - | satty -f -
bind = $mod SHIFT, P, exec, grim -g "$(slurp)" - | satty -f - --initial-tool crop --copy-command wl-copy --early-exit

# File picker
bind = $mod, I, exec, ghostty --title=fzf-picker -e bash -c "~/.config/fuzzel/fuzzel-search.sh"

# Clipboard history
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Night light toggle
bind = $mod SHIFT, N, exec, pkill wlsunset && notify-send "Night Light OFF" || (wlsunset -t 3500 -T 9500 & notify-send "Night Light ON")

# Big cursor
bind = $mod ALT, C, exec, hyprctl setcursor Adwaita 128
bind = $mod ALT SHIFT, C, exec, hyprctl setcursor Adwaita 32

# Toggle gaps (Super+G = gaps on, Super+Shift+G = gaps off)
bind = $mod, G, exec, sh -c 'hyprctl keyword general:gaps_in 4 && hyprctl keyword general:gaps_out 8 && hyprctl keyword general:border_size 2'
bind = $mod SHIFT, G, exec, sh -c 'hyprctl keyword general:gaps_in 0 && hyprctl keyword general:gaps_out 0 && hyprctl keyword general:border_size 0'

# ═══════════════════════════════════════════════════════════════════════════════
#  WINDOW RULES
# ═══════════════════════════════════════════════════════════════════════════════
windowrule = float 1, match:title fzf-picker
windowrule = size 800 560, match:title fzf-picker
windowrule = center 1, match:title fzf-picker

windowrule = float 1, match:title wifi-manager
windowrule = size 500 400, match:title wifi-manager
windowrule = center 1, match:title wifi-manager

# Terminal transparency (frosted glass with blur)
# windowrule = opacity 0.38 0.42, match:class ghostty
