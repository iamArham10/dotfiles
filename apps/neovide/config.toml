# Default `nvim` on PATH — same ~/.config/nvim, ~/.local/share/nvim, ~/.cache/nvim as terminal.
# Smear-cursor.nvim is skipped when `vim.g.neovide` is set (lua/plugins/smear_cursor.lua).

fork = false

# ──────────────────────────────────────────────────────────────────────────────
# FONT
# Mirror Alacritty (~/.config/alacritty/alacritty.toml [font]).
# Zoom: vim.g.neovide_scale_factor (Ctrl +/-) in lua/core/neovide.lua
# ──────────────────────────────────────────────────────────────────────────────
[font]
size = 13.0

# ┌─ hinting ──────────────────────────────────────────────────────────────────┐
# │ Controls how glyphs snap to the pixel grid.                               │
# │ OPTIONS:                                                                  │
# │   "none"   → no grid-fitting, truest to font design (may look blurry)     │
# │   "slight" → minimal vertical adjustment, good balance                    │
# │   "normal" → full grid-fitting, makes glyphs taller/bolder               │
# │   "full"   → most aggressive, maximum pixel snapping                      │
# └────────────────────────────────────────────────────────────────────────────┘
hinting = "full"

# ┌─ edging ───────────────────────────────────────────────────────────────────┐
# │ Controls antialiasing mode.                                               │
# │ OPTIONS:                                                                  │
# │   "antialias"         → grayscale smoothing, can look thicker/heavier     │
# │   "subpixelantialias" → RGB subpixels, sharper/thinner (best for LCD)     │
# │   "alias"             → no smoothing, crisp but jagged edges              │
# └────────────────────────────────────────────────────────────────────────────┘
edging = "antialias"

# ┌─ OPTIONAL: underline_offset ───────────────────────────────────────────────┐
# │ Shift underline position vertically. Positive = down, negative = up.      │
# │ Uncomment the line below and change the number:                           │
# └────────────────────────────────────────────────────────────────────────────┘
# underline_offset = 0

# ──────────────────────────────────────────────────────────────────────────────
# FONT FAMILY & WEIGHT
# ──────────────────────────────────────────────────────────────────────────────
# ┌─ style ────────────────────────────────────────────────────────────────────┐
# │ Controls font weight. Change "Regular" to any of these:                   │
# │ OPTIONS:                                                                  │
# │   "Thin"  "ExtraLight"  "Light"  "Regular"  "Medium"                      │
# │   "SemiBold"  "Bold"  "ExtraBold"  "Black"  "ExtraBlack"                  │
# │   or variable weights: "W100" "W200" "W300" "W400" ... "W900"             │
# │   (W300 = Light, W400 = Regular, W700 = Bold)                             │
# └────────────────────────────────────────────────────────────────────────────┘
[[font.normal]]
family = "Fira Code"
style = "Light"

[[font.bold]]
family = "Fira Code"
style = "Bold"

[[font.italic]]
family = "Fira Code"
style = "Light"

[[font.bold_italic]]
family = "Fira Code"
style = "Bold"

# ──────────────────────────────────────────────────────────────────────────────
# FONT FEATURES (OpenType)
# ──────────────────────────────────────────────────────────────────────────────
# ┌─ OPTIONAL: add/remove features ────────────────────────────────────────────┐
# │ Common features you can add to the list:                                  │
# │   "+liga"          → ligatures (e.g. != becomes ≠)                        │
# │   "+calt"          → contextual alternates                                │
# │   "+zero"          → slashed zero                                         │
# │   "+ss01".."+ss20" → stylistic sets (font-specific alternate glyphs)      │
# └────────────────────────────────────────────────────────────────────────────┘
[font.features]
# "Fira Code" = ["+liga", "+calt"]
"Fira Code" = ["+liga", "+calt"]

# ──────────────────────────────────────────────────────────────────────────────
# BOX DRAWING
# If you see weird blocky artifacts for characters like │ ┆ ‾ (indent guides)
# ──────────────────────────────────────────────────────────────────────────────
# ┌─ mode ─────────────────────────────────────────────────────────────────────┐
# │ OPTIONS:                                                                  │
# │   "font-glyph" → use the font's own box-drawing glyphs                   │
# │   "custom"     → use Neovide's built-in renderer                         │
# └────────────────────────────────────────────────────────────────────────────┘
[box-drawing]
mode = "font-glyph"

# ┌─ OPTIONAL: custom line thickness ──────────────────────────────────────────┐
# │ Only works when mode = "custom". Values are [thin, thick] in pixels.      │
# │ Uncomment the two lines below:                                            │
# └────────────────────────────────────────────────────────────────────────────┘
# [box-drawing.sizes]
# default = [2, 4]
